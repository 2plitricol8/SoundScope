<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Calcolo orario INFN-LNS</title>
<style>
  /* Layout: una scheda centrata, campi orario in due colonne, risultati e barra sotto. */
  :root {
    --bg: #eef1f6; --card: #ffffff; --fg: #1b2433; --muted: #5f6b7c;
    --line: #d6dce6; --field: #f1f4f9; --accent: #1f5fbf; --accent-soft: #e6effc;
    --ok: #17803f; --warn: #b36b00; --bad: #c0392b; --track: #e3e8f0;
    --shadow: 0 10px 30px rgba(20, 35, 60, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151d; --card: #181f2b; --fg: #e8edf5; --muted: #98a3b6;
      --line: #2a3445; --field: #111823; --accent: #5b9bff; --accent-soft: #1d2b44;
      --ok: #45c47a; --warn: #e5a73a; --bad: #ef6a5b; --track: #263043;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151d; --card: #181f2b; --fg: #e8edf5; --muted: #98a3b6;
    --line: #2a3445; --field: #111823; --accent: #5b9bff; --accent-soft: #1d2b44;
    --ok: #45c47a; --warn: #e5a73a; --bad: #ef6a5b; --track: #263043;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg); color: var(--fg);
    padding-inline: 16px; padding-block: 24px;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 16px;
  }
  .card {
    width: 100%; max-width: 460px; margin: 0 auto; background: var(--card);
    border-radius: 18px; box-shadow: var(--shadow); padding: 26px 22px 22px;
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
  .group { margin-top: 22px; }
  .group h2 { margin: 0 0 10px; font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
  .row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .row > div, .tile { min-width: 0; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 5px; }
  input[type=time] {
    -webkit-appearance: none; appearance: none; display: block;
    width: 100%; min-width: 0; min-height: 48px; font: inherit; font-size: 1.15rem; text-align: left;
    padding: 10px 10px; color: var(--fg); background: var(--field);
    border: 1.5px solid var(--line); border-radius: 10px; outline: none;
  }
  input[type=time]:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.err { border-color: var(--bad); }
  .check { display: flex; align-items: center; gap: 10px; margin: 18px 0 0; font-size: .95rem; color: var(--fg); cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex: none; }
  .note { margin: 6px 0 0 32px; font-size: .8rem; color: var(--muted); min-height: 1.1em; }
  .hint { margin: 8px 0 0; font-size: .78rem; color: var(--muted); }
  .results { margin-top: 26px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .tile { background: var(--accent-soft); border-radius: 12px; padding: 14px 14px; }
  .tile .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .tile .v { font-size: 1.8rem; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.ok .v { color: var(--ok); }
  .tile.neg .v { color: var(--bad); }
  .progress { margin-top: 20px; }
  .progress .top { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin-bottom: 7px; }
  .track { height: 12px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar { height: 100%; width: 0; border-radius: 99px; background: var(--warn); transition: width .3s ease, background .3s; }
  .bar.full { background: var(--ok); }
  .status { margin-top: 8px; font-size: .88rem; font-weight: 600; min-height: 1.2em; }
  .msg { margin-top: 12px; font-size: .82rem; color: var(--bad); min-height: 1em; }
  .actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 10px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent); opacity: .9; }
  button {
    font: inherit; font-size: .9rem; padding: 10px 18px; cursor: pointer; color: var(--accent);
    background: transparent; border: 1.5px solid var(--line); border-radius: 10px;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  footer { margin-top: 16px; text-align: center; font-size: .72rem; color: var(--muted); }
  @media (max-width: 400px) {
    .card { padding: 22px 14px 18px; }
    input[type=time] { font-size: 1.05rem; }
    .tile .v { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>
</head>
<body>

<main class="card">
  <header>
    <h1>Calcolo orario</h1>
    <p>INFN-LNS &middot; Working Time by PL</p>
  </header>

  <section class="group">
    <h2>Mattina</h2>
    <div class="row">
      <div><label for="in1">Entrata 1</label><input type="time" id="in1"></div>
      <div><label for="out1">Uscita 1</label><input type="time" id="out1"></div>
    </div>
  </section>

  <section class="group">
    <h2>Pomeriggio</h2>
    <div class="row">
      <div><label for="in2">Entrata 2</label><input type="time" id="in2"></div>
      <div><label for="out2">Uscita 2</label><input type="time" id="out2"></div>
    </div>
    <p class="hint">Con una sola entrata e uscita lascia vuoti i campi del pomeriggio.</p>
    <label class="check"><input type="checkbox" id="pausa"> Detrai pausa pranzo (30 min)</label>
    <div class="note" id="pausaNote"></div>
  </section>

  <section class="results" aria-live="polite">
    <div class="tile"><div class="k">Orario effettuato</div><div class="v" id="tot">0:00</div></div>
    <div class="tile neg" id="straTile"><div class="k">Straordinario</div><div class="v" id="stra">-7:12</div></div>
  </section>

  <section class="progress">
    <div class="top"><span>Giornata (7:12)</span><span id="pct">0%</span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="status" id="status"></div>
  </section>

  <div class="msg" id="msg"></div>
  <noscript><div class="msg">JavaScript non attivo: il calcolo non può funzionare. Controlla le impostazioni del browser.</div></noscript>
  <div class="actions"><button type="button" id="reset">Azzera</button><button type="button" id="calc" class="primary">Calcola</button></div>
  <footer>Orario giornaliero di riferimento: 7h 12min (432 minuti)</footer>
</main>

<script>
(function () {
  var DAILY = 432;
  var ids = ["in1", "out1", "in2", "out2"];
  var el = {};
  ids.concat(["tot", "stra", "straTile", "bar", "pct", "status", "msg", "reset", "calc", "pausa", "pausaNote"]).forEach(function (i) { el[i] = document.getElementById(i); });

  function toMin(v) {
    if (!v) return 0;
    var p = v.split(":");
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  }
  function fmt(m) {
    var s = m < 0 ? "-" : "";
    m = Math.abs(m);
    var mm = m % 60;
    return s + Math.floor(m / 60) + ":" + (mm < 10 ? "0" : "") + mm;
  }
  function span(a, b, label, errors) {
    if (!el[a].value || !el[b].value) return 0;
    var d = toMin(el[b].value) - toMin(el[a].value);
    if (d < 0) {
      errors.push("L'uscita " + label + " è precedente all'entrata.");
      el[a].classList.add("err"); el[b].classList.add("err");
      return 0;
    }
    return d;
  }
  var last = "";
  function calc(force) {
    var key = ids.map(function (i) { return el[i].value; }).join("|") + "|" + el.pausa.checked;
    if (!force && key === last) return;
    last = key;
    var errors = [];
    ids.forEach(function (i) { el[i].classList.remove("err"); });
    var lavorato = span("in1", "out1", "1", errors) + span("in2", "out2", "2", errors);
    // Pausa pranzo: detrae 30 minuti se non c'e' rientro pomeriggio
    // oppure, se la pausa tra uscita 1 ed entrata 2 e' inferiore a 30 minuti, detrae la parte mancante (30 - pausa).
    var detratto = 0, nota = "";
    if (el.pausa.checked && lavorato > 0) {
      var rientro = el.in2.value && el.out2.value;
      if (!rientro) {
        detratto = 30; nota = "Nessun rientro: detratti 30 min";
      } else if (el.out1.value && el.in2.value) {
        var gap = toMin(el.in2.value) - toMin(el.out1.value);
        if (gap < 0) {
          errors.push("L'entrata 2 \u00e8 precedente all'uscita 1.");
          el.in2.classList.add("err"); el.out1.classList.add("err");
        } else if (gap < 30) {
          detratto = 30 - gap; nota = "Pausa di " + gap + " min (meno di 30): detratti " + detratto + " min";
        } else {
          nota = "Pausa di " + gap + " min: nessuna detrazione";
        }
      }
    }
    el.pausaNote.textContent = nota;
    var tot = Math.max(0, lavorato - detratto);
    var stra = tot - DAILY;
    el.tot.textContent = fmt(tot);
    el.stra.textContent = (stra > 0 ? "+" : "") + fmt(stra);
    el.straTile.className = "tile" + (stra > 0 ? " ok" : stra < 0 ? " neg" : "");
    el.bar.style.width = Math.min(100, Math.round(tot / DAILY * 100)) + "%";
    el.bar.className = "bar" + (tot >= DAILY ? " full" : "");
    el.pct.textContent = Math.round(tot / DAILY * 100) + "%";
    if (tot === 0) { el.status.textContent = ""; }
    else if (stra > 0) { el.status.textContent = "Giornata completata: " + fmt(stra) + " di straordinario"; el.status.style.color = "var(--ok)"; }
    else if (stra === 0) { el.status.textContent = "Giornata completata esatta"; el.status.style.color = "var(--ok)"; }
    else { el.status.textContent = "Mancano " + fmt(-stra) + " per completare la giornata"; el.status.style.color = "var(--warn)"; }
    el.msg.textContent = errors.join(" ");
  }
  ids.forEach(function (i) {
    ["input", "change", "blur", "keyup"].forEach(function (ev) { el[i].addEventListener(ev, function () { calc(false); }); });
  });
  // iOS non sempre notifica ogni scatto del selettore orario: controllo periodico dei valori.
  setInterval(function () { calc(false); }, 250);
  try { el.pausa.checked = localStorage.getItem("pausa30") === "1"; } catch (e) {}
  el.pausa.addEventListener("change", function () {
    try { localStorage.setItem("pausa30", el.pausa.checked ? "1" : "0"); } catch (e) {}
    calc(true);
  });
  el.reset.addEventListener("click", function () { ids.forEach(function (i) { el[i].value = ""; }); calc(true); });
  el.calc.addEventListener("click", function () { calc(true); });
  calc(true);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
